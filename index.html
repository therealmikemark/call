<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Call</title>
<style>
  body { font: 20px -apple-system, system-ui, sans-serif; text-align: center; padding: 40px 16px; background: #fff; color: #111; }
  a { display: inline-block; margin-top: 16px; padding: 14px 28px; border-radius: 10px; background: #1a7f37; color: #fff; text-decoration: none; }
</style>
</head>
<body>
<!-- Click-to-call for the Google Sheets app, which only opens https links.
     Link here as https://therealmikemark.github.io/call/#4075551234 - the number stays after the #,
     so it's never sent to GitHub. -->
<div id="msg">No number in the link.</div>
<a id="call" hidden>Call</a>
<script>
  var digits = location.hash.replace(/\D/g, "");
  if (digits.length === 10) digits = "1" + digits;
  if (digits.length === 11) {
    var tel = "tel:+" + digits;
    var shown = "(" + digits.slice(1, 4) + ") " + digits.slice(4, 7) + "-" + digits.slice(7);
    document.getElementById("msg").textContent = shown;
    var link = document.getElementById("call");
    link.href = tel;
    link.textContent = "Call " + shown;
    link.hidden = false;
    location.replace(tel);
  }
</script>
</body>
</html>
